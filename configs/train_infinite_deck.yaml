name: infinite-deck-v1
output_root: runs

data:
  dataset_dir: data/infinite_deck

model:
  n_layer: 4
  n_head: 4
  d_model: 256
  dropout: 0.0
  context_len: null

train:
  val_frac: 0.1
  split_seed: 0
  batch_size: 64
  epochs: 3
  warmup_steps: 100
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 100
  eval_max_batches: 40
  log_interval: 50
  device: auto
  seed: 0

probe:
  alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  probe_eval_frac: 0.4
  probe_split_seed: 0
  depth_bands: [[0, 10], [10, 20], [20, 30], [30, 40]]
  max_shoes: 2000

eval:
  max_shoes: 200
  samples_per_position: 8
  sample_temperature: 1.0
  seed: 0
