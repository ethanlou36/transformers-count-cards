[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjackgpt"
version = "0.1.0"
description = "Finite-shoe blackjack research code and numerical analyses"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=18",
]

[project.scripts]
blackjackgpt-data = "blackjackgpt.data.cli:main"
blackjackgpt-paired-history = "blackjackgpt.eval.paired_history:main"

[project.optional-dependencies]
hub = [
    "huggingface_hub>=0.32,<1",
]
production = [
    "numpy==2.4.6",
    "pyarrow==19.0.1",
    "huggingface_hub==0.36.2",
    "hf-xet==1.5.1",
]
dev = [

    "mypy==1.19.1",
    "ruff==0.14.14",
]

ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas==2.2.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
ignore = [

    "RUF001",
    "RUF002",
    "RUF003",

    "RUF043",

    "B905",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
